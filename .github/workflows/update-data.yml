name: Update NTU data

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: update-data
  cancel-in-progress: false

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install PHP extensions
        run: sudo apt-get update && sudo apt-get install -y php-cli php-curl php-xml
      - name: Fetch, parse, and validate
        run: php scripts/update_data.php
        env:
          PLAN_DIAGNOSTICS_DIR: ${{ runner.temp }}/plan-update-diagnostics
      - name: Preserve update failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: update-data-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/plan-update-diagnostics/
            back_end/data/raw/
          retention-days: 7
          if-no-files-found: warn
      - name: Commit updated data
        id: commit
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo 'No timetable data changes; skipping commit and deploy.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'Timetable data changed; committing and deploying.'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add academic-calendar.json back_end/config.php back_end/data/raw back_end/data/parsed js/engine.js
          git commit -m 'chore: refresh NTU timetable data'
          git push
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      # A push made with GITHUB_TOKEN does not start the push-triggered deploy workflow.
      - name: Deploy updated data
        if: steps.commit.outputs.changed == 'true'
        run: bash scripts/deploy.sh
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_TARGET: ${{ secrets.DEPLOY_TARGET }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
